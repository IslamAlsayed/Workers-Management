<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/app.css?v=2.0" />
    <link rel="stylesheet" href="./css/login.css?v=2.0" />
    <title>إدارة العمال - تسجيل الدخول</title>
</head>

<body>
    <section id="loginView" class="view">
        <div class="card login-card">
            <div class="brand-header">
                <div class="app-icon">👷</div>
                <h1>إدارة العمال</h1>
                <p class="muted" id="authSubtitle">سجل الدخول لإدارة مجموعة العمال</p>
            </div>

            <!-- Auth Tabs -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tabLogin">
                    🔑 تسجيل الدخول
                </button>
                <button type="button" class="auth-tab" id="tabRegister">
                    ✨ مجموعة جديدة
                </button>
                <button type="button" class="auth-tab" id="tabFeatures">
                    ✨ مميزات التطبيق
                </button>
            </div>

            <!-- Form 1: Login -->
            <form id="loginFormContainer" class="form-section">
                <label>
                    <span>اسم المستخدم (معرف المجموعة)</span>
                    <input id="username" placeholder="مثال: ismail" autocomplete="username" autofocus />
                </label>
                <label>
                    <span>كلمة المرور</span>
                    <input id="password" type="password" placeholder="••••" inputmode="numeric" autocomplete="current-password" />
                </label>
                <button id="loginBtn" class="primary wide">دخول المجموعه ←</button>
            </form>

            <!-- Form 2: Create New Group -->
            <form id="registerFormContainer" class="form-section" style="display: none;">
                <label>
                    <span>اسم المجموعة</span>
                    <input id="regGroupName" placeholder="مثال: مجموعة ورشة النصر" autocomplete="off" />
                </label>
                <label>
                    <span>معرف المجموعة (اسم المستخدم لتسجيل الدخول)</span>
                    <input id="regGroupId" placeholder="مثال: el-nasr" autocomplete="off" />
                    <small class="field-hint">يُستخدم لتسجيل الدخول إلى المجموعة</small>
                </label>
                <label>
                    <span>كلمة المرور للمجموعة</span>
                    <input id="regPassword" type="password" placeholder="4 أرقام أو أكثر" inputmode="numeric" autocomplete="new-password" />
                </label>
                <label>
                    <span>وصف المجموعة (اختياري)</span>
                    <input id="regDescription" placeholder="مثال: عمال المعمار والتشطيبات" autocomplete="off" />
                </label>
                <select name="currency" id="regCurrency">
                    <option value="EGP" selected>جنية مصري</option>
                    <option value="SAR">ريال سعودي</option>
                </select>
                <button id="registerBtn" class="primary wide">إنشاء المجموعة والدخول ✨</button>
            </form>
        </div>
    </section>
    <div id="toast"></div>
    <script src="./js/version.js?v=2.0"></script>
    <script src="./js/common.js?v=2.0"></script>
    <script src="./js/auth.js?v=2.0"></script>
</body>

</html>
