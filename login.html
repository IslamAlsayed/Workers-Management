<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/login.css" />
    <title>إدارة العمال - الرئيسية</title>
</head>

<body>
    <section id="loginView" class="view">
        <div class="card login-card">
            <h1>إدارة العمال</h1>
            <p class="muted">سجل الدخول لإدارة مجموعة العمال</p>
            <label>
                <span>اسم المستخدم</span>
                <input id="username" autocomplete="username" />
            </label>
            <label>
                <span>كلمة المرور</span>
                <input id="password" type="password" inputmode="numeric" autocomplete="current-password">
            </label>
            <button id="loginBtn" class="primary">دخول</button>
        </div>
    </section>
    <div id="toast"></div>
    <script src="./js/common.js"></script>
    <script src="./js/auth.js"></script>
    <script>

    </script>
</body>

</html>
