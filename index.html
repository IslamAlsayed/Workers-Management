<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/app.css?v=2.0" />
    <link rel="stylesheet" href="./css/toast.css?v=2.0" />
    <title>إدارة العمال - الرئيسية</title>
</head>

<body>
    <div class="layout-page" id="layout-page"></div>
    <div id="app">
        <div id="header"></div>
        <main class="main">
            <section class="welcome">
                <div>
                    <small>اليوم</small>
                    <h1 id="welcomeMessageInner">صباح الخير يا معلم 👋</h1>
                    <p id="adminDescriptionInner">خلّي حسابات الشغل ماشية <b>من غير ورق</b> أو <b>أنترنت</b>.</p>
                </div>
                <time id="today"></time>
            </section>
            <div class="stats">
                <div><span>👥</span><b id="workersCount">0</b><small>عامل</small></div>
                <div><span>✓</span><b id="presentCount">0</b><small>حاضر اليوم</small></div>
                <div><span>×</span><b id="absentCount">0</b><small>غائب اليوم</small></div>
                <div><span>💰</span><b id="wagesCount">0</b><small>أجور اليوم</small></div>
            </div>
            <section>
                <div class="sectionHead">
                    <div>
                        <h2>إجراءات سريعة</h2>
                        <small>أهم العمليات في ضغطة</small>
                    </div>
                </div>
                <div class="quick">
                    <button class="" data-page="attendance.html">
                        <div>✓<b>حضور اليوم</b></div>
                        <span>تسجيل الحضور والغياب</span>
                    </button>
                    <button id="quickExpense">
                        <div>💳<b>إضافة مصروف</b></div>
                        <span>سلفة أو مصروف عامل</span>
                    </button>
                    <button id="quickOvertime">
                        <div>⚡<b>إضافة إضافي</b></div>
                        <span>اختياري أو إجباري</span>
                    </button>
                    <button data-page="workers.html">
                        <div>👤+<b>إضافة عامل</b></div>
                        <span>إدارة العمال</span>
                    </button>
                </div>
            </section>
            <section>
                <div class="sectionHead">
                    <div>
                        <h2>ملخص اليوم</h2>
                        <small>نظرة سريعة على الحسابات</small>
                    </div>
                    <button class="link" data-page="reports.html">التفاصيل ←</button>
                </div>
                <div class="summary">
                    <p><span>إجمالي اليومية</span><b id="dailyTotal">0 ج</b></p>
                    <p><span>المصاريف / السلف</span><b id="expenseTotal">0 ج</b></p>
                    <p><span>الإضافي</span><b id="overtimeTotal">0 ج</b></p>
                    <p class="total"><span>الصافي</span><b id="netTotal">0 ج</b></p>
                </div>
            </section>
            <footer id="footer"></footer>
        </main>
        <nav class="nav">
            <button class="active" data-page="index.html">⌂<small>الرئيسية</small></button>
            <button data-page="workers.html">👥<small>العمال</small></button>
            <button data-page="attendance.html">✓<small>الحضور</small></button>
            <button data-page="reports.html">▥<small>التقارير</small></button>
            <button data-page="settings.html">⚙<small>الإعدادات</small></button>
        </nav>
    </div>
    <div id="toast"></div>
    <div class="overlay" id="transactionModal">
        <div class="sheet">
            <div class="handle"></div>
            <div class="sheetHead">
                <h2 id="txTitle">إضافة مصروف</h2>
                <button class="close">×</button>
            </div>
            <form id="transactionForm" class="formGrid">
                <label>العامل<select id="txWorkerId"></select></label><label>المبلغ<input id="txAmount" required min="1" type="number" inputmode="decimal" /></label><label>السبب<textarea id="txReason"
                        maxlength="120"></textarea></label><input type="hidden" id="txType" />
                <div class="actions">
                    <button class="primary">حفظ</button>
                </div>
            </form>
        </div>
    </div>
    <script src="./js/auth.js?v=2.0"></script>
    <script src="./js/version.js?v=2.0"></script>
    <script src="./js/common.js?v=2.0"></script>
    <script src="./js/dashboard.js?v=2.0"></script>
    <script>
        function fillWorkers() {
            const s = document.getElementById("txWorkerId");
            s.innerHTML = S.workers
                .map((w) => `<option value="${w.id}">${w.name}</option>`)
                .join("");
        }
        function quick(type) {
            fillWorkers();
            document.getElementById("txType").value = type;
            document.getElementById("txTitle").textContent =
                type === "expense" ? "إضافة مصروف" : "إضافة إضافي";
            openModal("transactionModal");
        }
        document.getElementById("quickExpense").onclick = () => quick("expense");
        document.getElementById("quickOvertime").onclick = () =>
            quick("overtime");
        bindModal("transactionModal");
        document.getElementById("transactionForm").onsubmit = (e) => {
            e.preventDefault();
            const workerId = document.getElementById("txWorkerId").value;
            const w = S.workers.find(
                (x) => String(x.id) === String(workerId),
            ),
                amount = Number(document.getElementById("txAmount").value),
                type = document.getElementById("txType").value;
            if (!w || amount <= 0) return toast("أدخل مبلغًا صحيحًا", true, ERROR_NOTIFICATION_COLOR);

            const date = today();
            const note = $("#txNote")?.value.trim() || "";

            const transaction = addTransaction(
                workerId,
                type,
                amount,
                note,
                date,
            );

            if (!transaction) {
                return toast("تعذر تسجيل العملية", true, "#ff8e8e");
            }

            save();
            closeModal("transactionModal");
            e.target.reset();
            location.reload();
            toast("تم الحفظ", null, UPDATE_NOTIFICATION_COLOR);
        };
    </script>
</body>

</html>
