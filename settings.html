<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/app.css" />
    <title>الإعدادات</title>
</head>

<body>
    <div class="layout-page" id="layout-page"></div>
    <div id="app">
        <div id="header"></div>
        <main class="main">
            <section class="heading">
                <div>
                    <small>التطبيق</small>
                    <h1>الإعدادات</h1>
                    <p>تحكم في تجربة الاستخدام.</p>
                </div>
            </section>
            <div class="list">
                <button class="setting" id="theme">
                    <span>🌙</span>
                    <div><b id="textMode">الوضع الليلي</b><small>تغيير مظهر التطبيق</small></div>
                    <em id="themeText">مغلق</em>
                </button>
                <div class="setting">
                    <span>☁️</span>
                    <div><b>حالة البيانات</b><small>البيانات محفوظة محليًا</small></div>
                    <em>محلي</em>
                </div>
                <button class="setting" id="install" hidden>
                    <span>📱</span>
                    <div>
                        <b>تثبيت التطبيق</b><small>أضف التطبيق للشاشة الرئيسية</small>
                    </div>
                    <em>تثبيت</em>
                </button>
            </div>
            <section style="margin-block: 40px;">
                <div class="sheetHead">
                    <h2 id="adminTitle">تعديل بيانات المدير</h2>
                </div>
                <form id="adminForm" class="formGrid">
                    <label>
                        رسالة ترحيبية
                        <input id="welcomeMessage" maxlength="80" />
                    </label>
                    <label>
                        اسم المستخدم
                        <input id="adminName" maxlength="80" />
                    </label>
                    <label>
                        كلمة المرور
                        <input id="adminPassword" minlength="3" maxlength="100" />
                    </label>
                    <label>
                        الوصف
                        <textarea id="adminDescription" maxlength="250"></textarea>
                    </label>
                    <div class="actions">
                        <button class="primary">حفظ</button>
                    </div>
                </form>
            </section>
            <footer id="footer"></footer>
        </main>
        <nav class="nav">
            <button data-page="index.html">⌂<small>الرئيسية</small></button>
            <button data-page="workers.html">👥<small>العمال</small></button>
            <button data-page="attendance.html">✓<small>الحضور</small></button>
            <button data-page="reports.html">▥<small>التقارير</small></button>
            <button class="active" data-page="settings.html">⚙<small>الإعدادات</small></button>
        </nav>
    </div>
    <div id="toast"></div>
    <script src="./js/auth.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/settings.js"></script>
</body>

</html>
