<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/app.css" />
    <title>التقارير</title>
</head>

<body>
    <div class="layout-page" id="layout-page"></div>
    <div id="app">
        <div id="header"></div>
        <main class="main">
            <section class="heading">
                <div>
                    <small>الأرقام</small>
                    <h1>التقارير</h1>
                    <p>راجع الحسابات حسب الفترة.</p>
                </div>
            </section>
            <div class="card">
                <div class="dates">
                    <label><span>من</span><input id="from" type="date" /></label>
                    <label><span>إلى</span><input id="to" type="date" /></label>
                </div>
                <button class="primary wide" id="reportBtn">عرض التقرير</button>
            </div>
            <div id="report" class="list"></div>
            <footer id="footer"></footer>
        </main>
        <nav class="nav">
            <button data-page="index.html">⌂<small>الرئيسية</small></button>
            <button data-page="workers.html">👥<small>العمال</small></button>
            <button data-page="attendance.html">✓<small>الحضور</small></button>
            <button class="active" data-page="reports.html">
                ▥<small>التقارير</small>
            </button>
            <button data-page="settings.html">⚙<small>الإعدادات</small></button>
        </nav>
    </div>
    <div id="toast"></div>
    <script src="./js/auth.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/reports.js"></script>
</body>

</html>
