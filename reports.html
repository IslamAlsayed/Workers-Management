<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/app.css?v=2.0" />
    <title>التقارير</title>
</head>

<body>
    <div class="layout-page" id="layout-page"></div>
    <div id="app">
        <div id="header"></div>
        <main class="main">
            <section class="heading">
                <div>
                    <small>الأرقام</small>
                    <h1>التقارير</h1>
                    <p>راجع الحسابات حسب الفترة.</p>
                </div>
            </section>
            <div class="card">
                <div class="dates">
                    <label><span>من</span><input id="from" type="date" /></label>
                    <label><span>إلى</span><input id="to" type="date" /></label>
                </div>
                <div class="report-actions-row" style="display:flex;gap:8px;margin-top:10px;">
                    <button class="primary wide" id="reportBtn">عرض التقرير</button>
                    <button class="secondary" id="printReportBtn" title="طباعة التقرير" style="white-space:nowrap;">🖨️ طباعة</button>
                    <button class="secondary" id="exportCsvBtn" title="تصدير Excel" style="white-space:nowrap;">📊 Excel</button>
                </div>
            </div>
            <!-- Printable Header for PDF/Paper Print -->
            <div class="print-only-header" style="display:none;margin-bottom:15px;text-align:center;">
                <h2 style="margin:0;">👷 تقرير حسابات العمال</h2>
                <p id="printDateRange" style="margin:4px 0 0 0;font-size:14px;color:#333;"></p>
            </div>
            <div id="report" class="list"></div>
            <footer id="footer"></footer>
        </main>
        <nav class="nav">
            <button data-page="index.html">⌂<small>الرئيسية</small></button>
            <button data-page="workers.html">👥<small>العمال</small></button>
            <button data-page="attendance.html">✓<small>الحضور</small></button>
            <button class="active" data-page="reports.html">
                ▥<small>التقارير</small>
            </button>
            <button data-page="settings.html">⚙<small>الإعدادات</small></button>
        </nav>
    </div>
    <div id="toast"></div>
    <script src="./js/auth.js?v=2.0"></script>
    <script src="./js/common.js?v=2.0"></script>
    <script src="./js/reports.js?v=2.0"></script>
</body>

</html>
