<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/app.css?v=2.0" />
    <link rel="stylesheet" href="./css/worker.css?v=2.0" />
    <title>بيانات العامل</title>
</head>

<body>
    <div id="app">
        <div id="header"></div>
        <main class="worker-page">
            <!-- Worker Header -->
            <section class="worker-profile card" id="workerProfile">
                <div class="loading">جاري تحميل بيانات العامل...</div>
            </section>

            <!-- Financial Summary -->
            <section class="section">
                <div class="section-title">
                    <h2>الملخص المالي</h2>
                </div>

                <div class="stats2">
                    <div class="stat">
                        <small>اليومية</small>
                        <b id="workerRate">0 ج</b>
                    </div>

                    <div class="stat">
                        <small>إجمالي المصاريف</small>
                        <b id="workerExpenses">0 ج</b>
                    </div>

                    <div class="stat">
                        <small>إجمالي الإضافي</small>
                        <b id="workerOvertime">0 ج</b>
                    </div>

                    <div class="stat">
                        <small>المستحق</small>
                        <b id="workerDue">0 ج</b>
                    </div>
                </div>
            </section>

            <!-- Attendance -->
            <section class="section card">
                <div class="section-title">
                    <h2>الحضور</h2>
                    <span class="muted">هذا الأسبوع</span>
                </div>

                <div class="attendance-summary" id="attendanceSummary">
                    جاري التحميل...
                </div>
            </section>

            <!-- Notes -->
            <section class="section card">
                <div class="section-title">
                    <h2>ملاحظات</h2>
                </div>

                <p id="workerNotes" class="worker-notes">لا توجد ملاحظات.</p>
            </section>

            <!-- Chronological Activity Ledger -->
            <section class="section card">
                <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
                    <h2>🧾 سجل الحركة التفصيلي</h2>
                    <button class="primary" id="settleAccountBtn" style="padding:6px 12px;font-size:12px;">💳 تسوية الحساب</button>
                </div>
                <div id="workerLedger" class="ledger-list" style="margin-top:10px;">
                    <div class="loading">جاري تحميل سجل الحركة...</div>
                </div>
            </section>

            <!-- Actions -->
            <section class="section worker-actions-page">
                <button class="btn primary" id="editWorkerBtn">
                    ✎ تعديل بيانات العامل
                </button>

                <button class="btn secondary" id="backBtn">← العودة للعمال</button>
            </section>
        </main>
    </div>

    <div id="toast"></div>

    <!-- Settlement Modal -->
    <div class="overlay" id="settlementModal">
        <div class="sheet">
            <div class="handle"></div>
            <div class="sheetHead">
                <h2>تسوية وتصفية حساب العامل</h2>
                <button class="close" id="closeSettlementModal">×</button>
            </div>
            <form id="settlementForm" class="formGrid">
                <label>المبلغ المسدد<input id="settleAmount" required min="0" type="number" inputmode="decimal" /></label>
                <label>ملاحظة التسوية<textarea id="settleNote" maxlength="120" placeholder="مثال: تسوية أجر الأسبوع المالي"></textarea></label>
                <div class="actions">
                    <button type="submit" class="primary">تأكيد التصفية</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./js/auth.js?v=2.0"></script>
    <script src="./js/version.js?v=2.0"></script>
    <script src="./js/common.js?v=2.0"></script>
    <script src="./js/worker.js?v=2.0"></script>
</body>

</html>
